[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "mytool"
dynamic = ["version"]
description = "A Python command-line tool sold with license keys: activation, free trial and a live kill switch"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "PWF Studio" }]
keywords = ["cli", "license-key", "licensing", "software-licensing", "typer", "pwfauth"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "typer>=0.12",
    "keyring>=24",
    "pwfauth>=1.5,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.10"]

[project.scripts]
mytool = "mytool.cli:main"

[project.urls]
"PWF Auth" = "https://pwfauth.com"
Documentation = "https://pwfauth.com/docs"

[tool.hatch.version]
path = "src/mytool/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mytool"]
exclude = ["src/mytool/_build_secret.py"]

[tool.hatch.build.targets.sdist]
exclude = ["src/mytool/_build_secret.py", ".venv", "dist", "build"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
